<svg width="960" height="340" viewBox="0 0 960 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t-mono { font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, Monaco, monospace; }
      .prompt { fill: #10B981; font-weight: 700; font-size: 15px; }
      .branch { fill: #38BDF8; font-weight: 500; font-size: 15px; }
      .cmd { fill: #F8FAFC; font-weight: 600; font-size: 15px; }
      .key { fill: #94A3B8; font-weight: 600; font-size: 14px; }
      .val { fill: #E2E8F0; font-weight: 400; font-size: 14px; }
      .highlight-cyan { fill: #38BDF8; font-weight: 600; }
      .highlight-green { fill: #10B981; font-weight: 600; }
      .highlight-purple { fill: #C084FC; font-weight: 600; }
      .highlight-amber { fill: #FBBF24; font-weight: 600; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="960" height="340" rx="16" fill="#090D16"/>
  <rect x="1" y="1" width="958" height="338" rx="15" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <rect width="960" height="42" rx="16" fill="#0F172A"/>
  <rect y="41" width="960" height="1" fill="#1E293B"/>

  <!-- Window Buttons -->
  <circle cx="24" cy="21" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="44" cy="21" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="64" cy="21" r="6" fill="#10B981" fill-opacity="0.85"/>

  <text x="480" y="26" text-anchor="middle" class="t-mono" font-size="13" fill="#64748B">vinicius@torres-core: ~/workspace/vektor</text>

  <!-- Terminal Session -->
  <!-- Line 1: Command Prompt -->
  <text x="32" y="74" class="t-mono">
    <tspan class="prompt">➜ </tspan>
    <tspan class="branch">ogarctorres git:(main) </tspan>
    <tspan class="cmd">fastfetch --profile engineer</tspan>
  </text>

  <!-- Decorative Separator -->
  <text x="32" y="104" class="t-mono" font-size="13" fill="#334155">--------------------------------------------------------------------------------</text>

  <!-- Key-Value Telemetry Block -->
  <text x="32" y="132" class="t-mono">
    <tspan class="key">architecture  │ </tspan>
    <tspan class="val">APIs Assíncronas em </tspan><tspan class="highlight-cyan">FastAPI</tspan><tspan class="val">, Webhooks, Arquitetura em Camadas &amp; Pydantic v2</tspan>
  </text>

  <text x="32" y="162" class="t-mono">
    <tspan class="key">security      │ </tspan>
    <tspan class="val">Supabase JWT com </tspan><tspan class="highlight-green">Cache TTL (60s)</tspan><tspan class="val">, Rate Limiting Sliding-Window &amp; Multi-Tenant</tspan>
  </text>

  <text x="32" y="192" class="t-mono">
    <tspan class="key">data &amp; io     │ </tspan>
    <tspan class="val">Upload defensivo em </tspan><tspan class="highlight-amber">chunks 64KB</tspan><tspan class="val">, validação de Magic Bytes binários (%PDF-)</tspan>
  </text>

  <text x="32" y="222" class="t-mono">
    <tspan class="key">applied-ai    │ </tspan>
    <tspan class="val">Google Gemini Flash via </tspan><tspan class="highlight-purple">Batch Matching</tspan><tspan class="val"> (de 40s para &lt;3.5s) + Guardrails Anti-Injection</tspan>
  </text>

  <text x="32" y="252" class="t-mono">
    <tspan class="key">reliability   │ </tspan>
    <tspan class="highlight-green">88 testes automatizados</tspan><tspan class="val"> (Pytest) cobrindo regras, segurança e resiliência E2E</tspan>
  </text>

  <text x="32" y="282" class="t-mono">
    <tspan class="key">production    │ </tspan>
    <tspan class="val">SaaS rodando em </tspan><tspan class="highlight-cyan">vektor-career.vercel.app</tspan><tspan class="val"> (Render + Vercel)</tspan>
  </text>

  <!-- Cursor -->
  <text x="32" y="314" class="t-mono">
    <tspan class="prompt">➜ </tspan><tspan class="cmd">_</tspan>
  </text>
  <rect x="52" y="302" width="8" height="15" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
