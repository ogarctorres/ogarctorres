<svg width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Vinicius Torres — Desenvolvedor Full Stack &amp; Backend</title>
  <desc id="desc">Identificação visual com nome, atuação em Engenharia de Software e stack principal.</desc>

  <defs>
    <linearGradient id="hairline" x1="260" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5E7EB" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#E5E7EB" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#E5E7EB" stop-opacity="0.10"/>
      <stop offset="0.78" stop-color="#E5E7EB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E5E7EB" stop-opacity="0"/>
    </linearGradient>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        dominant-baseline: alphabetic;
      }

      .stroke { vector-effect: non-scaling-stroke; }
      .decor { stroke: url(#hairline); }
      .label {
        fill: #D6DEE8;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.14em;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 2px;
        stroke-opacity: 0.42;
      }
      .title {
        fill: #F8FAFC;
        font-size: 72px;
        font-weight: 760;
        letter-spacing: -0.04em;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 3px;
        stroke-opacity: 0.46;
      }
      .subtitle {
        fill: #E2E8F0;
        font-size: 21px;
        font-weight: 430;
        letter-spacing: 0;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 2px;
        stroke-opacity: 0.38;
      }
      .pill {
        fill: #0B1220;
        fill-opacity: 0.55;
        stroke: #475569;
        stroke-opacity: 0.42;
      }
      .pill-text {
        fill: #F8FAFC;
        font-size: 14px;
        font-weight: 680;
        letter-spacing: 0;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 1.4px;
        stroke-opacity: 0.42;
      }
