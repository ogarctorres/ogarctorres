<svg width="1200" height="320" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060913"/>
      <stop offset="0.6" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080D1A"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F2FE"/>
      <stop offset="0.5" stop-color="#4FACFE"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, Monaco, monospace; }
      .title-name { font-size: 54px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.03em; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #94A3B8; letter-spacing: -0.01em; }
      .status-pill { fill: #0F172A; stroke: #00F2FE; stroke-opacity: 0.35; }
      .metric-card { fill: #0B132B; stroke: #1E293B; stroke-opacity: 0.8; rx: 12px; }
      .metric-val { font-size: 16px; font-weight: 700; fill: #38BDF8; }
      .metric-lbl { font-size: 11px; font-weight: 500; fill: #64748B; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- Radial Glow Behind Title -->
  <circle cx="200" cy="160" r="180" fill="#00F2FE" fill-opacity="0.04" filter="blur(60px)"/>
  <circle cx="1000" cy="160" r="160" fill="#8B5CF6" fill-opacity="0.04" filter="blur(60px)"/>

  <!-- Top Status Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" class="status-pill"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18.5" class="font-mono" font-size="11.5" font-weight="600" fill="#38BDF8" letter-spacing="0.08em">BACKEND DEVELOPER // CS STUDENT</text>
  </g>

  <!-- Main Title & Bio -->
  <text x="60" y="132" class="font-sans title-name">Vinicius Torres</text>
  <text x="60" y="170" class="font-sans subtitle">Desenvolvedor Backend em formação · Python · FastAPI · APIs REST · SQL</text>

  <!-- Tech Badges Bar -->
  <g transform="translate(60, 202)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="102" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <circle cx="15" cy="15" r="4" fill="#38BDF8"/>
      <text x="26" y="19" class="font-mono" font-size="12" font-weight="600" fill="#E2E8F0">Python</text>
    </g>
    <!-- FastAPI -->
    <g transform="translate(112, 0)">
      <rect width="102" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <circle cx="15" cy="15" r="4" fill="#009688"/>
      <text x="26" y="19" class="font-mono" font-size="12" font-weight="600" fill="#E2E8F0">FastAPI</text>
    </g>
    <!-- PostgreSQL / SQL -->
    <g transform="translate(224, 0)">
      <rect width="128" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <circle cx="15" cy="15" r="4" fill="#336791"/>
      <text x="26" y="19" class="font-mono" font-size="12" font-weight="600" fill="#E2E8F0">PostgreSQL</text>
    </g>
    <!-- Pytest -->
    <g transform="translate(362, 0)">
      <rect width="100" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <circle cx="15" cy="15" r="4" fill="#10B981"/>
      <text x="26" y="19" class="font-mono" font-size="12" font-weight="600" fill="#E2E8F0">Pytest</text>
    </g>
    <!-- Docker -->
    <g transform="translate(472, 0)">
      <rect width="100" height="30" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <circle cx="15" cy="15" r="4" fill="#2496ED"/>
      <text x="26" y="19" class="font-mono" font-size="12" font-weight="600" fill="#E2E8F0">Docker</text>
    </g>
  </g>

  <!-- Right Side: Engineering Telemetry HUD Cards -->
  <g transform="translate(680, 52)">
    <!-- Metric 1: Foco Principal -->
    <g transform="translate(0, 0)">
      <rect width="220" height="95" class="metric-card"/>
      <text x="18" y="32" class="font-mono metric-lbl">Foco Técnico</text>
      <text x="18" y="66" class="font-mono metric-val" fill="#10B981">🐍 Backend Python</text>
      <text x="18" y="83" class="font-sans" font-size="11" fill="#64748B">FastAPI, SQLAlchemy &amp; REST</text>
    </g>

    <!-- Metric 2: Qualidade -->
    <g transform="translate(240, 0)">
      <rect width="220" height="95" class="metric-card"/>
      <text x="18" y="32" class="font-mono metric-lbl">Testes de Software</text>
      <text x="18" y="66" class="font-mono metric-val" fill="#38BDF8">🧪 88 Testes</text>
      <text x="18" y="83" class="font-sans" font-size="11" fill="#64748B">suíte automatizada com Pytest</text>
    </g>

    <!-- Metric 3: Formação -->
    <g transform="translate(0, 115)">
      <rect width="220" height="95" class="metric-card"/>
      <text x="18" y="32" class="font-mono metric-lbl">Formação Acadêmica</text>
      <text x="18" y="66" class="font-mono metric-val" fill="#A855F7">🎓 Ciência da Comp.</text>
      <text x="18" y="83" class="font-sans" font-size="11" fill="#64748B">graduação em andamento</text>
    </g>

    <!-- Metric 4: Objetivo -->
    <g transform="translate(240, 115)">
      <rect width="220" height="95" class="metric-card"/>
      <text x="18" y="32" class="font-mono metric-lbl">Momento de Carreira</text>
      <text x="18" y="66" class="font-mono metric-val" fill="#F59E0B">🎯 1ª Oportunidade</text>
      <text x="18" y="83" class="font-sans" font-size="11" fill="#64748B">buscando estágio / júnior</text>
    </g>
  </g>

  <!-- Bottom Cyber Border -->
  <rect x="0" y="318" width="1200" height="2" fill="url(#accentGlow)"/>
</svg>
